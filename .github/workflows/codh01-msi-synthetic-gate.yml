name: codh01-msi-synthetic-only
on:
  push:
    paths:
      - 'case-studies/codex-h/msi_lab/**'
      - '.github/workflows/codh01-msi-synthetic-gate.yml'
  pull_request:
    paths:
      - 'case-studies/codex-h/msi_lab/**'
      - '.github/workflows/codh01-msi-synthetic-gate.yml'
  workflow_dispatch:
jobs:
  synthetic-test-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r case-studies/codex-h/msi_lab/requirements.txt
      - env:
          PYTHONPATH: case-studies/codex-h
        run: python -m unittest discover -s case-studies/codex-h/msi_lab/tests -v
