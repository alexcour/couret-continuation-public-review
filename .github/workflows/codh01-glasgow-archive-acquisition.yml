name: codh01-glasgow-archive-acquisition
on:
  push:
    paths:
      - 'case-studies/codex-h/inspect_glasgow_2105.py'
      - '.github/workflows/codh01-glasgow-archive-acquisition.yml'
  pull_request:
    paths:
      - 'case-studies/codex-h/inspect_glasgow_2105.py'
      - '.github/workflows/codh01-glasgow-archive-acquisition.yml'
  workflow_dispatch:
jobs:
  independent-public-archive-inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Fetch official public ZIP and parse TEI (NO K1 CERTIFICATION)
        run: |
          python3 case-studies/codex-h/inspect_glasgow_2105.py --download --output /tmp/codh01_2105.json > /dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/codh01_2105.json').read_text(encoding='utf-8'))
          entries=d.get('xml_records',[])
          focus=[x for x in entries if any(y in {'86v','87r'} for y in x.get('folio_ids',[])) or
                 ('86v' in x.get('member','')) or ('87r' in x.get('member',''))]
          s=['# COD-H-01 public source ZIP: inventory only',
             'Dataset: '+str(d['dataset_doi']),
             'ZIP sha256: '+str(d['sha256']),
             'XML entries: '+str(d['xml_count']),
             '86v/87r member candidates: '+str(len(focus)),
             'No ancient reading is certified by this automated check.']
          for x in entries[:15]:
              s.append('XML member inventory: '+str(x.get('member'))+' / folios '+str(x.get('folio_ids'))+' / numbers '+str(x.get('rubric_numbers')))
          for x in focus[:15]:
              s.append('Candidate: '+str(x.get('member'))+' / folios '+str(x.get('folio_ids'))+' / numbers '+str(x.get('rubric_numbers')))
          Path('/tmp/codh01_summary.txt').write_text('\n'.join(s)+'\n',encoding='utf-8')
          print('\n'.join(s))
          PY
